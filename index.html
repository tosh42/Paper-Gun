<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tosh42 &mdash; Back shortly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--ink:#121010;--cream:#eae3d3;--gold:#9c8a6a;--gold-l:#b5a37e;--red:#a3271d;--red-l:#c0392b;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--ink);color:var(--cream);font-family:'Cormorant Garamond',Georgia,serif;min-height:100vh;}

.hero{position:relative;width:100%;min-height:100vh;
      background-image:url('hatshaddow.jpg');background-size:cover;background-position:50% 3%;
      background-repeat:no-repeat;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(to bottom,var(--ink) 0%,rgba(18,16,16,.30) 18%,rgba(18,16,16,.10) 42%,rgba(18,16,16,.68) 76%,var(--ink) 100%);}

.content{position:relative;z-index:2;text-align:center;padding:0 1.5rem 3.4rem;max-width:40rem;}
.line{font-size:clamp(1.25rem,2.6vw,1.75rem);font-weight:300;line-height:1.5;
      text-shadow:0 2px 18px rgba(18,16,16,.9);}
.tagline{font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.24em;text-transform:uppercase;
      color:var(--gold);opacity:.9;margin-top:1.9rem;}
.contact-button{display:inline-block;margin-top:.9rem;padding:.95em 2.6em;background:var(--red);
      color:var(--cream);font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.24em;
      text-transform:uppercase;text-decoration:none;transition:background .2s,transform .15s;}
.contact-button:hover{background:var(--red-l);transform:translateY(-2px);}

@media(max-width:700px){
  .hero{background-position:52% 2%;}
  .content{padding-bottom:2.6rem;}
}
</style>
</head>
<body>
<div class="hero">
  <div class="content">
    <p class="line">We&rsquo;re rebuilding &mdash; a fresh look. Back shortly.</p>
    <p class="tagline">Questions? Get in touch</p>
    <a href="mailto:bookings@tosh42.com" class="contact-button">Contact</a>
  </div>
</div>
</body>
</html>
