<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tosh42 — Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #e8e8e8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .hero {
            width: 100%;
            height: 60vh;
            background-image: url('Herorepl1.png');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .hero::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
        }

        .content {
            flex: 1;
            padding: 4rem 2rem;
            max-width: 700px;
            margin: 0 auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }

        .under-construction {
            font-size: 1.1rem;
            color: #b0b0b0;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .video-container {
            width: 100%;
            max-width: 600px;
            margin: 2rem auto;
            aspect-ratio: 16 / 9;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .contact-button {
            display: inline-block;
            padding: 1rem 2rem;
            background: #8b0000;
            color: #f5f5f5;
            text-decoration: none;
            font-size: 1rem;
            letter-spacing: 0.05em;
            transition: background 0.3s ease;
            margin: 1rem auto;
            border: none;
            cursor: pointer;
        }

        .contact-button:hover {
            background: #a00000;
        }

        .tagline {
            font-size: 0.95rem;
            color: #999;
            margin-top: 1rem;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .hero {
                height: 50vh;
            }

            h1 {
                font-size: 1.8rem;
            }

            .content {
                padding: 2rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="hero"></div>
    
    <div class="content">
        <div>
            <h1>We're Rebuilding</h1>
            <p class="under-construction">
                tosh42.com is getting a fresh look. In the meantime, enjoy the old clips video.
            </p>
        </div>

        <div class="video-container">
            <iframe 
                src="https://www.youtube-nocookie.com/embed/yRW2X8nYylk" 
                title="Preview" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>

        <div>
            <p class="tagline">Questions? Get in touch.</p>
            <a href="mailto:bookings@tosh42.com" class="contact-button">Contact</a>
        </div>
    </div>
</body>
</html>
