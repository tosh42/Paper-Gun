<style>

/* HERO */

.act-acc > summary{list-style:none;cursor:pointer;padding:1.1rem 1.3rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;}

.acc-t{font-family:'Cinzel',serif;font-size:clamp(.95rem,2vw,1.15rem);letter-spacing:.12em;text-transform:uppercase;color:#b5a37e;}
.act-acc[open] > summary{border-bottom:1px solid rgba(156,138,106,.22);}

/* ── Mobile line-breaking ──────────────────────────────────────────────
   Short text is balanced across its lines instead of being left with a
   stranded word or half-clause on the last line. Chromium and Safari only
   balance blocks of four lines or fewer, so body prose is untouched;
   browsers without support ignore it and wrap as before. */
h1,h2,h3,h4,h5,p,li,figcaption,blockquote,dd,dt,
.kind,.guest,.sl,.sec-head,.sec-sub,.cap,.vid-title,.dv-label,
.act-h,.act-sub,.peek-cap,.tb-h,.poster-hint,.who,.label,.terms
 { text-wrap: balance; }

/* ── Phone legibility ──────────────────────────────────────────────────
   Cormorant Garamond is a display face: fine strokes, small x-height. Body
   text also sat at the bottom of its clamp on a phone and was dimmed. Below
   600px the root size is scaled, so every proportion the page already sets
   grows together, and reading text gets the 500 weight and its full
   contrast. Nothing changes on a tablet or a desktop. */
@media(max-width:600px){
  html { font-size: 117%; }
  p, li, blockquote, dd, figcaption, .body {
    font-weight: 500;
    opacity: 1 !important;
  }
}
