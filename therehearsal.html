<title>The Rehearsal — Paper Gun, three acts · Paul Tosh</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--ink:#121010;--cream:#eae3d3;--parchment:#e6dfd1;--gold:#9c8a6a;--gold-l:#b5a37e;--ash:#211d19;--red:#a3271d;--red-l:#c0392b;--border:rgba(156,138,106,.18);}
body{background:var(--ink);color:var(--cream);font-family:'Cormorant Garamond',Georgia,serif;font-size:17px;line-height:1.75;overflow-x:hidden;}
a{color:var(--gold);text-decoration:none;}
a:hover{color:var(--gold-l);}

/* TOP BAR */
#top-bar{background:rgba(13,11,8,.97);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:.75rem 2rem;flex-wrap:wrap;gap:1rem;}
#top-bar a{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--cream);opacity:.8;}
#top-bar a:hover{opacity:1;color:var(--gold);}
#top-bar .book-btn{background:var(--gold);color:var(--ink);padding:.5em 1.6em;opacity:1;}
#top-bar .book-btn:hover{background:var(--gold-l);color:var(--ink);}

/* HERO */
#hero{text-align:center;padding:5rem 2rem 3rem;border-bottom:1px solid var(--border);}
#hero .eyebrow{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);opacity:.8;margin-bottom:1.5rem;}
#hero h1{font-family:'Cormorant Garamond',serif;font-size:clamp(3.5rem,10vw,7rem);font-weight:300;line-height:.95;color:var(--cream);margin-bottom:.5rem;}
#hero h1 em{font-style:italic;color:var(--gold-l);}
#hero .note{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1rem,1.6vw,1.15rem);color:var(--cream);opacity:.8;max-width:560px;margin:1.5rem auto 0;line-height:1.7;}
#hero .note strong{font-style:normal;opacity:.8;color:var(--gold);}

/* Paul, speaking the note */
.say{display:flex;gap:1.4rem;align-items:flex-start;flex-wrap:wrap;border:1px solid rgba(156,138,106,.3);background:rgba(156,138,106,.05);padding:1.8rem 1.7rem;}
.say-btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:.5em;background:none;border:1px solid rgba(181,163,126,.55);border-radius:999px;color:#b5a37e;font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;padding:.5em 1em;cursor:pointer;transition:background .2s;}
.say-btn:hover{background:rgba(156,138,106,.12);}
.say-text{flex:1 1 320px;min-width:260px;}
.say-text p{font-size:1.02rem;line-height:1.8;opacity:.85;margin-bottom:.9rem;}
.say-text p:last-child{margin-bottom:0;}
/* act accordions */
.act-acc{border:1px solid rgba(156,138,106,.28);margin-bottom:1rem;background:rgba(255,255,255,.015);}
.act-acc > summary{list-style:none;cursor:pointer;padding:1.1rem 1.3rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;}
.act-acc > summary::-webkit-details-marker{display:none;}
.acc-t{font-family:'Cinzel',serif;font-size:clamp(.95rem,2vw,1.15rem);letter-spacing:.12em;text-transform:uppercase;color:#b5a37e;}
.act-acc[open] > summary{border-bottom:1px solid rgba(156,138,106,.22);}
.act-acc[open] > summary .song-arrow{transform:rotate(90deg);}
.acc-body{padding:1.2rem 1.3rem 1.4rem;}
.act-sub{font-family:'Cinzel',serif;font-size:clamp(.95rem,2vw,1.12rem);letter-spacing:.12em;text-transform:uppercase;color:#b5a37e;text-align:center;margin:2.6rem 0 1rem;}
/* ACT SECTIONS */
.act-section{max-width:900px;margin:0 auto;padding:4rem 2rem;}
.act-header{text-align:center;margin-bottom:3rem;padding-bottom:2rem;border-bottom:1px solid var(--border);}
.act-label{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);opacity:.8;margin-bottom:.8rem;}
.act-title{font-family:'Cormorant Garamond',serif;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:300;color:var(--cream);line-height:1.1;margin-bottom:.4rem;}
.act-title em{font-style:italic;color:var(--gold-l);}
.act-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1rem;color:var(--cream);opacity:.8;}

/* VIDEO */
.video-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;margin-bottom:3rem;background:#000;border:1px solid var(--border);}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;}
/* ── VISIBLE PLAYLIST TRACKLIST ── */
.vj-tracklist{width:100%;margin:-1.6rem 0 2.6rem;border:1px solid rgba(156,138,106,.22);background:rgba(156,138,106,.03);max-height:440px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(156,138,106,.4) transparent;}
.vj-tracklist-head{position:sticky;top:0;z-index:2;background:#14100a;border-bottom:1px solid rgba(156,138,106,.25);padding:.55rem .8rem;font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);opacity:.85;}
.vj-track{display:flex;align-items:center;gap:.8rem;padding:.55rem .8rem;cursor:pointer;border-bottom:1px solid rgba(156,138,106,.1);transition:background .2s;}
.vj-track:last-child{border-bottom:none;}
.vj-track:hover{background:rgba(156,138,106,.08);}
.vj-track.playing{background:rgba(156,138,106,.13);}
.vj-track img{width:86px;aspect-ratio:16/9;object-fit:cover;flex-shrink:0;display:block;border:1px solid rgba(156,138,106,.2);}
.vj-track-num{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.15em;color:var(--gold);opacity:.8;flex-shrink:0;width:1.6em;text-align:right;}
.vj-track-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.98rem;color:var(--parchment);opacity:.8;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.vj-track.playing .vj-track-title{color:var(--gold-l);opacity:1;}
.vj-tracklist-note{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--parchment);opacity:.8;padding:.8rem;text-align:center;}
@media(max-width:680px){.vj-tracklist{max-height:340px;}}
.video-placeholder{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;background:rgba(13,11,8,.9);}
.video-placeholder p{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);opacity:.8;}

/* SONGS */
.songs-intro{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);opacity:.8;text-align:center;margin-bottom:1.5rem;}
.song-title em{font-style:italic;}
details[open] 
/* LYRICS */
.song-lyrics .song-lyrics .song-lyrics .song-lyrics 
/* DIVIDER */
.act-divider{border:none;border-top:1px solid var(--border);margin:0;}

/* BOTTOM CTA */
#bottom-cta{background:rgba(13,11,8,.97);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:2rem;padding:1rem 2rem;flex-wrap:wrap;}
#bottom-cta p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.92rem;color:var(--cream);opacity:.8;}
#bottom-cta a.btn{background:var(--gold);color:var(--ink);font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;padding:.55em 1.8em;display:inline-block;transition:background .2s;}
#bottom-cta a.btn:hover{background:var(--gold-l);}

@media(max-width:600px){
  #hero{padding:3rem 1.5rem 2rem;}
  .act-section{padding:3rem 1.2rem;}
    #top-bar{justify-content:center;}
  #bottom-cta p{display:none;}
}

.act-h{font-family:'Cinzel',serif;font-size:clamp(1.2rem,3vw,1.8rem);letter-spacing:.16em;text-transform:uppercase;color:var(--cream);text-align:center;margin:4.5rem 0 2rem;padding-top:2rem;border-top:1px solid rgba(156,138,106,.25);}
.song-h{font-family:'Cinzel',serif;font-size:1.05rem;letter-spacing:.08em;color:var(--gold-l);margin:2.6rem 0 .8rem;}
.role-p{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.22em;color:var(--gold);opacity:.85;margin:.9rem 0 .2rem;}
.dir-p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.95rem;color:var(--cream);opacity:.8;margin:.5rem 0;}
.curtain-p{font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);text-align:center;margin:2.5rem 0;}
.b-p{font-weight:600;color:var(--cream);opacity:.92;margin:.3rem 0;}
.s-p{font-family:'Cormorant Garamond',serif;font-size:1.02rem;line-height:1.55;color:var(--cream);opacity:.86;margin:0;}
.sp{height:.7rem;}
.script-wrap{max-width:720px;margin:0 auto;padding:0 2rem;}
.ctx-sec{font-family:'Cinzel',serif;font-size:1rem;letter-spacing:.12em;text-transform:uppercase;color:var(--cream);margin:3rem 0 1rem;padding-bottom:.5rem;border-bottom:1px solid rgba(156,138,106,.25);}
.ctx-sub{font-family:'DM Mono',monospace;font-size:.66rem;letter-spacing:.16em;color:var(--gold-l);margin:1.8rem 0 .5rem;}

.song-item{border-bottom:1px solid rgba(156,138,106,.12);}
.song-item summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:.8rem;padding:.85rem 0;font-family:'Cormorant Garamond',serif;}
.song-item summary::-webkit-details-marker{display:none;}
.song-item summary:hover .song-title{color:var(--gold-l);}
.song-num{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.12em;color:var(--gold);opacity:.8;min-width:2.2em;}
.song-title{font-size:clamp(1.02rem,2vw,1.2rem);color:var(--parchment);opacity:.92;}
.song-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.92rem;color:var(--gold);opacity:.8;margin-left:auto;padding-left:1rem;text-align:right;}
.song-arrow{font-family:'DM Mono',monospace;color:var(--gold);opacity:.8;margin-left:.6rem;}
.song-item[open] .song-arrow{transform:rotate(90deg);display:inline-block;}
.song-lyrics{white-space:pre-wrap;font-family:'Cormorant Garamond',serif;font-size:1.02rem;line-height:1.6;color:var(--parchment);opacity:.85;padding:.4rem 0 1.8rem 3rem;}
.stage-dir{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);opacity:.8;}
.lP{display:block;font-family:'Cormorant Garamond',serif;font-style:normal;color:var(--parchment);opacity:.95;margin-left:-1.4rem;padding-right:.4rem;}
.stage-dir.rP{color:var(--gold-l,#b5a37e);opacity:1;margin-left:-1.4rem;}
.lN{display:inline-block;font-style:italic;padding-left:1.15em;}
.lB{display:inline-block;font-style:italic;font-weight:600;padding-left:1.15em;}
.lG{opacity:.72;}
.stage-dir.role{color:var(--gold-l,#b5a37e);opacity:.95;}
.stage-dir.role.rN,.stage-dir.role.rB{margin-left:1.15em;}
.sub-h{display:block;font-family:'Cinzel',serif;font-size:.92rem;letter-spacing:.1em;
       color:var(--gold-l,#b5a37e);opacity:.9;margin:1.4rem 0 .4rem;}

.act-pre{font-family:'Cormorant Garamond',serif;font-size:1rem;line-height:1.6;color:var(--parchment);opacity:.8;margin-bottom:2rem;}
.ctx-sec{font-family:'Cinzel',serif;font-size:1rem;letter-spacing:.12em;text-transform:uppercase;color:var(--parchment);margin:2.6rem 0 1rem;padding-bottom:.5rem;border-bottom:1px solid rgba(156,138,106,.25);}
@media(max-width:680px){.song-lyrics{padding-left:1rem;}.song-sub{display:none;}}
.ctx-body{text-align:left;padding-left:1.6rem;padding-right:.4rem;}
.ctx-body p{text-align:left;margin:0 0 .85rem;line-height:1.7;}
@media(max-width:680px){.ctx-body{padding-left:.8rem;}}

/* rehearsal page */
#rh-top{background:rgba(13,11,8,.97);border-bottom:1px solid var(--border);padding:.7rem 2rem;
        display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
#rh-top .mark{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.3em;
        text-transform:uppercase;color:var(--gold);}
#rh-top .priv{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.22em;
        text-transform:uppercase;color:var(--cream);opacity:.45;}
.caveat{max-width:720px;margin:0 auto;padding:2.4rem 0 0;}
.caveat .lab{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.34em;
        text-transform:uppercase;color:var(--gold);margin-bottom:1rem;text-align:center;}
.caveat p{font-size:1.06rem;line-height:1.8;color:var(--cream);opacity:.88;margin-bottom:1rem;}
.caveat .box{border-top:1px solid var(--border);border-bottom:1px solid var(--border);
        padding:1.8rem 0 1.6rem;}
.qmark{font-style:italic;opacity:.5;font-size:.92em;letter-spacing:.01em;}
.act-set{max-width:900px;margin:-.4rem auto 1.5rem;text-align:center;
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold);opacity:.78;line-height:2;}
.vidslot{max-width:900px;margin:0 auto 2.6rem;}
.vidslot .frame{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;background:#000;
        border:1px solid var(--border);}
.vidslot .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.vidslot .pending{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:.8rem;text-align:center;
        background:repeating-linear-gradient(135deg,#171412 0 14px,#141110 14px 28px);}
.vidslot .pending p{font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.26em;
        text-transform:uppercase;color:var(--gold);opacity:.85;}
.vidslot .cap{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.22em;
        text-transform:uppercase;color:var(--gold);opacity:.75;margin-top:.7rem;text-align:center;}
.rh-wrap{max-width:900px;margin:0 auto;padding:0 2rem;}
.dl{max-width:720px;margin:4rem auto 0;text-align:center;border-top:1px solid var(--border);
        padding-top:2.4rem;}
.dl a.btn{display:inline-block;margin-top:1rem;background:var(--gold);color:var(--ink);
        font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;
        padding:.9em 2.2em;}
.dl a.btn:hover{background:var(--gold-l);color:var(--ink);}
.dl p{font-size:1.02rem;opacity:.85;}
.dl p.dl-note{font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;opacity:.55;margin-top:1rem;}
.pl-wrap{max-width:860px;margin:0 auto;}
.pl-frame{aspect-ratio:16/9;background:#000;border:1px solid var(--border);}
.pl-frame > div,.pl-frame iframe{width:100%;height:100%;}
.pl-list{max-height:420px;overflow-y:auto;border:1px solid var(--border);border-top:none;
        background:rgba(255,255,255,.02);}
.pl-head{position:sticky;top:0;background:#171412;border-bottom:1px solid rgba(156,138,106,.25);
        padding:.55rem .8rem;font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.3em;
        text-transform:uppercase;color:var(--gold);}
.pl-track{display:flex;align-items:center;gap:.8rem;padding:.55rem .8rem;cursor:pointer;
        border-bottom:1px solid rgba(156,138,106,.08);transition:background .15s;}

.pl-track.playing{background:rgba(156,138,106,.16);}
.pl-track img{width:72px;height:40px;object-fit:cover;flex-shrink:0;}
.pl-num{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--gold);opacity:.8;width:1.4em;}
.pl-tt{font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:var(--cream);opacity:.9;
        line-height:1.3;}

        text-transform:uppercase;color:var(--gold);opacity:.8;}
.provenance{font-family:'DM Mono',ui-monospace,monospace;font-size:.57rem;letter-spacing:.26em;
        text-transform:uppercase;text-align:center;color:#9c8a6a;opacity:.6;line-height:2;
        margin:0;padding:3rem 1.2rem 2rem;}

/* ── Mobile line-breaking ──────────────────────────────────────────────
   Short text is balanced across its lines instead of being left with a
   stranded word or half-clause on the last line. Chromium and Safari only
   balance blocks of four lines or fewer, so body prose is untouched;
   browsers without support ignore it and wrap as before. */
h1,h2,h3,h4,h5,p,li,figcaption,blockquote,dd,dt,
.kind,.guest,.sl,.sec-head,.sec-sub,.cap,.vid-title,.dv-label,
.act-h,.act-sub,.peek-cap,.tb-h,.poster-hint,.who,.label,.terms
 { text-wrap: balance; }

<style>#gate{min-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4.5rem 16px 5rem;background:#121010;}

#gate .g-text{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:clamp(1.08rem,2.4vw,1.25rem);line-height:1.7;color:#eae3d3;opacity:.88;margin:0 0 1.8rem;}
