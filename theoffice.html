<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Office &mdash; tosh42</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>

:root{--ink:#121010;--cream:#eae3d3;--gold:#9c8a6a;--gold-l:#b5a37e;--red:#a3271d;--red-l:#c0392b;--border:rgba(156,138,106,.22);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--ink);color:var(--cream);font-family:'Cormorant Garamond',Georgia,serif;overflow-x:hidden;min-height:100vh;}
a{color:var(--gold-l);}

.page-hero{text-align:center;padding:4.6rem 2rem 3rem;border-bottom:1px solid var(--border);}
.page-hero .kicker{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.5em;text-transform:uppercase;color:var(--gold);opacity:.85;margin-bottom:1.1rem;}
.page-hero h1{font-family:'Cinzel',serif;font-weight:400;font-size:clamp(2rem,6vw,3.4rem);letter-spacing:.1em;color:var(--cream);line-height:1.2;margin-bottom:.9rem;}
.page-hero .sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1rem,2vw,1.25rem);color:var(--cream);opacity:.8;max-width:660px;margin:0 auto;line-height:1.7;}
.page-hero .stamp{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);opacity:.65;margin-top:1.5rem;}

.wrap{max-width:900px;margin:0 auto;padding:3.2rem 2rem;}
.wrap.tight{padding-top:2.2rem;padding-bottom:2.2rem;}
.sec-label{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);opacity:.8;margin-bottom:.8rem;}
h2.sec-title{font-family:'Cinzel',serif;font-weight:400;font-size:clamp(1.35rem,3.2vw,2rem);letter-spacing:.05em;color:var(--cream);margin-bottom:1.3rem;line-height:1.25;}
h3.sub-title{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-l);margin:2.2rem 0 .9rem;}
.body{font-size:clamp(1.02rem,1.8vw,1.15rem);line-height:1.88;color:var(--cream);opacity:.82;letter-spacing:.015em;margin-bottom:1.05rem;}
.body em{color:var(--gold-l);font-style:italic;}
.body strong{color:var(--cream);opacity:1;font-weight:600;}
.rule{max-width:600px;margin:0 auto;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.25;}

.lede{font-family:'Cormorant Garamond',serif;font-size:clamp(1.2rem,2.6vw,1.5rem);line-height:1.7;color:var(--cream);opacity:.95;border-left:2px solid var(--red);padding-left:1.4rem;margin-bottom:1.4rem;}

ul.marks{list-style:none;padding-left:0;margin-bottom:1.1rem;}
ul.marks li{border-left:2px solid rgba(156,138,106,.35);padding-left:1.05rem;margin-bottom:.85rem;font-size:clamp(1rem,1.7vw,1.1rem);line-height:1.8;color:var(--cream);opacity:.82;}
ul.marks li strong{color:var(--gold-l);opacity:1;font-weight:600;}
ol.nums{list-style:none;counter-reset:n;padding-left:0;margin-bottom:1.1rem;}
ol.nums li{counter-increment:n;position:relative;padding-left:2.4rem;margin-bottom:1rem;font-size:clamp(1rem,1.7vw,1.1rem);line-height:1.8;color:var(--cream);opacity:.82;}
ol.nums li::before{content:counter(n);position:absolute;left:0;top:.15em;font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.1em;color:var(--red-l);}
ol.nums li strong{color:var(--cream);opacity:1;font-weight:600;}

.panel{border:1px solid var(--border);background:rgba(255,255,255,.02);padding:1.8rem 1.9rem;margin:1.6rem 0;}
.panel.hot{border-color:rgba(163,39,29,.55);background:rgba(163,39,29,.07);}
.panel h4{font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.28em;text-transform:uppercase;color:var(--red-l);margin-bottom:.8rem;}
.panel p{font-size:clamp(1rem,1.7vw,1.1rem);line-height:1.85;color:var(--cream);opacity:.85;margin-bottom:.8rem;}
.panel p:last-child{margin-bottom:0;}

.quote{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.08rem,2.1vw,1.3rem);line-height:1.75;color:var(--cream);opacity:.95;border-left:2px solid var(--gold);padding-left:1.3rem;margin:1.1rem 0;}

.tbl-scroll{overflow-x:auto;margin:1.3rem 0 1.6rem;-webkit-overflow-scrolling:touch;}
table{border-collapse:collapse;width:100%;min-width:520px;}
th{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);text-align:left;padding:.7rem .9rem;border-bottom:1px solid rgba(156,138,106,.4);vertical-align:bottom;font-weight:400;}
td{font-size:clamp(.95rem,1.55vw,1.04rem);line-height:1.66;color:var(--cream);opacity:.82;padding:.78rem .9rem;border-bottom:1px solid rgba(156,138,106,.13);vertical-align:top;}
td:first-child{color:var(--gold-l);opacity:1;}
td.price{font-family:'DM Mono',monospace;font-size:.86rem;letter-spacing:.04em;color:var(--cream);opacity:.95;white-space:nowrap;}
tr:last-child td{border-bottom:none;}

.tofill{font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--red-l);background:rgba(163,39,29,.14);border:1px solid rgba(163,39,29,.4);padding:.1em .6em;white-space:nowrap;}

footer{text-align:center;padding:2.4rem 1.6rem;border-top:1px solid rgba(156,138,106,.1);}
footer p{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:var(--cream);opacity:.65;line-height:2;}
footer a{color:var(--gold-l);text-decoration:none;}

@media(max-width:680px){
  .wrap{padding:2.4rem 1.2rem;}
  .lede{padding-left:1rem;}
}
@media print{
  body{background:#fff;color:#111;}
  .page-hero,.wrap{padding:1rem 0;}
  h2.sec-title,.page-hero h1{color:#111;}
  .body,td,ul.marks li,ol.nums li,.panel p{color:#111;opacity:1;}
  .panel{border:1px solid #999;background:none;}
  td:first-child,h3.sub-title,.sec-label,th{color:#6b5a2e;}
  .tbl-scroll{overflow:visible;}
  table{min-width:0;}
  section{break-inside:avoid;}
}

/* the gate */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}
#gate .card{max-width:430px;width:100%;text-align:center;border:1px solid var(--border);background:rgba(255,255,255,.02);padding:3rem 2.2rem;}
#gate .kick{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.5em;text-transform:uppercase;color:var(--gold);opacity:.8;margin-bottom:1.2rem;}
#gate h1{font-family:'Cinzel',serif;font-weight:400;font-size:clamp(1.6rem,5vw,2.3rem);letter-spacing:.12em;margin-bottom:1rem;}
#gate p{font-size:1.02rem;line-height:1.8;opacity:.78;margin-bottom:1.8rem;}
#gate input{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--border);color:var(--cream);
  font-family:'DM Mono',monospace;font-size:1rem;letter-spacing:.3em;text-align:center;padding:.9rem;outline:none;}
#gate input:focus{border-color:var(--gold-l);}
#gate button{margin-top:1rem;width:100%;background:var(--red);color:var(--cream);border:none;cursor:pointer;
  font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.26em;text-transform:uppercase;padding:.95rem;transition:background .2s;}
#gate button:hover{background:var(--red-l);}
#gate button[disabled]{opacity:.55;cursor:default;}
#gate .err{color:var(--red-l);font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.18em;
  text-transform:uppercase;margin-top:1rem;min-height:1.1em;}
#gate .ask{font-size:.95rem;opacity:.6;margin:1.6rem 0 0;}
#gate .ask a{color:var(--gold-l);}
#content{display:none;}
@media print{#gate{display:none;}}
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <p class="kick">Private</p>
    <h1>THE OFFICE</h1>
    <p>This page is for people in conversation with Paul about the operations and sales role.</p>
    <form id="f" autocomplete="off">
      <input id="pw" type="password" inputmode="numeric" placeholder="PASSWORD" aria-label="Password" autocomplete="off"/>
      <button id="go" type="submit">Enter</button>
    </form>
    <p class="err" id="err"></p>
    <p class="ask">Don&rsquo;t have it? Email <a href="mailto:bookings@tosh42.com">bookings@tosh42.com</a>.</p>
  </div>
</div>

<div id="content"></div>

  function bin(b64){var s=atob(b64),a=new Uint8Array(s.length);
    for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
  var gate=document.getElementById('gate'), out=document.getElementById('content'),
      err=document.getElementById('err'), pw=document.getElementById('pw'),
      go=document.getElementById('go');

  function show(html){
    out.innerHTML=html; out.style.display='block'; gate.style.display='none';
    document.title='The Office \u2014 tosh42';
    try{sessionStorage.setItem('office_ok','1');}catch(e){}
    window.scrollTo(0,0);
  }
  async function unlock(pass){
    if(!window.crypto||!crypto.subtle){
      err.textContent='This browser can\u2019t open the page \u2014 try Chrome or Safari.'; return false;}
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:bin(SALT),iterations:ITER,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['decrypt']);
    try{
      var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bin(NONCE)},key,bin(DATA));
      show(new TextDecoder().decode(plain));
      try{sessionStorage.setItem('office_pw',pass);}catch(e){}
      return true;
    }catch(e){ return false; }
  }
  document.getElementById('f').addEventListener('submit',async function(ev){
    ev.preventDefault(); err.textContent=''; go.disabled=true; go.textContent='Opening\u2026';
    var ok=await unlock(pw.value.trim());
    if(!ok){ err.textContent='Not that one.'; pw.value=''; pw.focus(); }
    go.disabled=false; go.textContent='Enter';
  });
  // stay open while the tab is open
  try{ var saved=sessionStorage.getItem('office_pw');
       if(sessionStorage.getItem('office_ok')==='1'&&saved){ unlock(saved); } }catch(e){}
  pw.focus();
})();
